<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice plan · Badminton Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body data-page="plan">
<header class="bar">
  <a class="brand" href="/">Badminton Coach</a>
  <nav><a href="/">Sessions</a><a href="/progress">Progress</a></nav>
</header>
<main class="plan">
  <div class="toolbar">
    <button id="print" type="button" class="primary">Print</button>
    <a id="back" class="button" href="/">Back to the session</a>
  </div>
  <section>
    <h1 id="plan-heading">Your practice plan</h1>
    <p id="plan-meta" class="meta"></p>
  </section>

  <div id="plan-body"></div>
</main>
</body>
</html>
